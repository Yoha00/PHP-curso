<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores</title>
    <style>
        body{
            background-color: rgb(255, 255, 255);
            color: rgb(14, 6, 6);
            font: normal 20px Helvetica;
        }
    </style> 
</head>
<body>
    <script>
        var num1 = window.prompt("Digite o primeiro número desejado: ")
        var num2 = window.prompt("Digite o segundo número desejado: ")
        var resultado = (Number(num1) + Number(num2)) / 2
        document.write(`A média dos números ${num1} e ${num2} é: ${resultado}.`) 

    </script>  
</body>
</html>
