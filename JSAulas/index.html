<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width="device-width", initial-scale=1.0">
    <title>Primeiro programa</title>
    <style>
        body{
            background-color: rgb(52, 50, 184);
            color: white;
            font: normal 20px Helvetica;
        }
    </style>
</head>
<body>
    <script> //Aparece primeiro que o texto, porque o script é lido antes do texto
        alert("Bem vindo") //Caixa de alerta
        confirm("Você tem certeza que quer continuar?") //Caixa de confirmação, retorna true ou false
        var aura = prompt("Qual seu nome?") //Caixa de prompt, retorna o valor digitado
    </script>
    <h1>Olá, <script>document.write(aura)</script></h1> </h1>
    <p>Testando aaaaaaa</p>
</body>
</html>
