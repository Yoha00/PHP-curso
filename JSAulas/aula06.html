<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(52, 50, 184);
            color: white;
            font: normal 20px Helvetica;
        }
        h1{
            color: rgb(255, 255, 255);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Poggers.</p>
    <script>
        var n1 = Number(window.prompt("Digite um número ")) //window.prompt retorna apenas string
        var n2 = Number(window.prompt("Digite outro número ")) //Number() converte string para número. Tambem tem parseInt() e parseFloat(). Para strings pode usar  String() ou n.toString()
        var s = n1 + n2
        window.alert("A soma é " + s) //concatenação de string
    </script>
</body>
</html>
